name    = Dancer
author  = Dancer Core Developers
license = Perl_5
copyright_holder = Alexis Sukrieh
copyright_year   = 2010
main_module = lib/Dancer.pm

version = 1.3522

[NextRelease]
filename = Changes

[TestRelease]
[ConfirmRelease]

[Git::Tag]

[@Filter]
-bundle=@Dancer
-remove=Covenant
-remove=Test::UnusedVars
-remove=Test::NoTabs
-remove=ChangeStats::Git
-remove=Manifest
NextVersion::Semantic.format=%d.%02d%02d
autoprereqs_skip=Person|mro
ChangeStats::Git.develop_branch=devel
dev_branch=devel
release_branch=master
upstream=origin

authority=cpan:SUKRIA

[Git::Contributors]
[ContributorsFile]
[Signature]
[InstallGuide]
[CPANFile]

[Prereqs / RuntimeRequires ]
Crypt::URandom = 0.36

[ReadmeAnyFromPod]

[DOAP]
process_changes = 1

[Prereqs / RuntimeRecommends ]
; Dancer::Serializer::YAML hands untrusted request bodies to $module::Load,
; so the floors here are a security constraint:
;
; For YAML (pure Perl):
;   1.25  introduced $YAML::LoadBlessed. The serializer sets it to 0 itself so
;         the protection does not depend on YAML.pm's ambient default -- but
;         below 1.25 the variable does not exist and setting it is a silent
;         no-op, leaving !!perl/hash:Some::Class able to instantiate an
;         arbitrary blessed object from a request body.
;   1.26  fixed a parsing regression introduced in 1.25.
;   1.28  "only enable loading globs when $LoadCode is set" -- an upstream
;         security fix in the same load path we expose to untrusted input, and
;         unlike LoadBlessed it is behavioural, so we cannot reproduce it from
;         our side on older versions. This is the real security floor.
;   1.30  changed the $YAML::LoadBlessed default to 0. We override it
;         explicitly either way, so this adds nothing functionally -- but it
;         keeps the safe behaviour if our explicit setting is ever lost in a
;         refactor.
;
; YAML::XS reads its own YAML::XS:: namespace, so it is protected separately:
;   0.69  introduced $YAML::XS::LoadBlessed (the toggle the serializer sets)
;   0.75  introduced $YAML::XS::LoadCode / $YAML::XS::UseCode, which was the
;         same code-loading path's only guard
;   0.81  changed the $YAML::XS::LoadBlessed default to 0. Again we override
;         it explicitly either way; the floor is 0.81 for the same reason as
;         YAML 1.30 -- the version where the default itself became safe.
;
; The YAML floor of 1.30 also supersedes the Dancer2-era 0.86 floor
; (https://github.com/PerlDancer/Dancer2/issues/899) and the exclusion of the
; broken 1.16.
YAML = 1.30
YAML::XS = 0.81
MIME::Types = 2.17

; We don't require JSON for runtime, but several serialiser tests should have
; it in order to fully test their behaviour - so add it here as a test
; requirement.
[Prereqs / TestRequires ]
JSON = 2.90
HTTP::Tiny = 0.014 ; for get/post/post_form
HTTP::CookieJar = 0.008
Test::LongString = 0


[MetaNoIndex]
; Don't let PAUSE index the shipped version of HTTP::Body
directory = lib/Dancer/HTTP



; authordep Dist::Zilla::Plugin::Test::ReportPrereqs
